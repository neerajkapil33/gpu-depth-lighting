<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Virtual Orbit Light</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080808;color:#f4f1e8;overflow:hidden}#app{position:fixed;inset:0;width:100%;height:100%;background:#000}#stage{position:absolute;inset:0;overflow:hidden;background:#000}#video,#output{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}#video{z-index:0;opacity:0;pointer-events:none}#output{z-index:1;background:#000}#light-field,#bulb{display:none!important}.control-toggle{position:fixed;right:18px;top:18px;z-index:30;padding:9px 12px;border:1px solid #ffffff22;background:#111c;color:#eee;border-radius:10px;cursor:pointer}.controls{position:fixed;right:0;top:0;width:330px;height:100vh;z-index:25;padding:70px 18px 18px;border-left:1px solid #ffffff1c;background:#101010ee;backdrop-filter:blur(18px);box-shadow:-20px 0 60px #000;display:block;overflow-y:auto}.controls h2{font-size:15px;margin:0 0 5px}.controls p{font-size:10px;color:#888;margin:0 0 16px}.control-row{display:grid;grid-template-columns:82px 1fr 42px;gap:8px;align-items:center;margin:12px 0;font-size:11px}.control-row input{width:100%;accent-color:#d39b42}.control-row output{text-align:right}.select-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.select-row label{font-size:10px;color:#999}.select-row select,.select-row input[type=color]{width:100%;margin-top:4px;background:#1b1b1b;color:#eee;border:1px solid #ffffff20;border-radius:7px;padding:6px}.panel-button{width:100%;margin-top:10px;border:1px solid #ffffff18;border-radius:9px;padding:9px;background:#1b1b1b;color:#eee;cursor:pointer}.panel-button.active{background:#e4ad55;color:#17120b}#orb-label{position:fixed;z-index:20;left:18px;bottom:18px;padding:10px 13px;border:1px solid #ffffff22;border-radius:999px;background:#080808aa;font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#55db83;margin-right:7px}.pill{padding:7px 10px;border-radius:999px;background:#201d18;color:#d7c7a6;font-size:11px}.panel{display:none}#hand-indicator{z-index:22!important}.controls:before{content:'LIGHT · DEPTH · SHADOW';display:block;color:#d7c7a6;font-size:9px;letter-spacing:1.5px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #ffffff12}@media(max-width:700px){.controls{width:min(330px,88vw)}#output{object-fit:contain}}</style></head><body><div id="app"><section id="stage"><video id="video" playsinline muted></video><canvas id="output" width="960" height="540"></canvas><button class="control-toggle" id="controls-toggle" type="button">⚙ Controls</button><div class="controls" id="controls-panel"><h2>Control panel</h2><p>Depth-space point light controls</p><button class="panel-button" id="light-toggle" type="button">Activate virtual bulb</button><div class="control-row"><label>intensity</label><input id="ctrl-intensity" type="range" min="0" max="8" step="0.1" value="3"><output id="ctrl-intensity-v">3.0</output></div><div class="control-row"><label>ambient</label><input id="ctrl-ambient" type="range" min="0" max="1" step="0.01" value="0.5"><output id="ctrl-ambient-v">0.50</output></div><div class="control-row"><label>relief</label><input id="ctrl-relief" type="range" min="0" max="1.5" step="0.01" value="0.85"><output id="ctrl-relief-v">0.85</output></div><div class="control-row"><label>shadow</label><input id="ctrl-shadow" type="range" min="0" max="1" step="0.01" value="0.7"><output id="ctrl-shadow-v">0.70</output></div><div class="control-row"><label>occlusion</label><input id="ctrl-occlusion" type="range" min="0" max="1" step="0.01" value="0.55"><output id="ctrl-occlusion-v">0.55</output></div><div class="select-row"><label>light color<input id="ctrl-color" type="color" value="#ffca80"></label><label>view<select id="ctrl-view"><option value="relit">relit</option><option value="camera">camera</option></select></label></div><div class="select-row"><label>camera<select id="ctrl-camera"><option value="front">front</option><option value="mirror">mirror</option></select></label><label>source<select id="ctrl-source"><option value="depth-anything">Depth Anything V2</option><option value="camera">camera only</option></select></label></div><button class="panel-button" id="ctrl-reset" type="button">Reset controls</button></div><div id="orb-label"><span class="dot"></span><b>3D POINT BULB</b> · depth-space light</div><div id="hand-indicator" style="display:none;position:absolute;width:18px;height:18px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none"></div></section></div><script type="module" src="./main.ts"></script></body></html>
